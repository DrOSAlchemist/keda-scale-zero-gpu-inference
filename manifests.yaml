apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-data}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            tcpSocket: {port: 6379}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/scale-zero-inference:latest
          ports: [{containerPort: 8080}]
          env: [{name: REDIS_URL, value: "redis://redis:6379"}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inference-worker}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector: {matchLabels: {app: inference-worker}}
  template:
    metadata: {labels: {app: inference-worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/scale-zero-inference:latest
          command: ["python", "-u", "worker.py"]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - {name: VLLM_URL, value: "http://vllm:8000/v1/completions"}
            - {name: MODEL_ID, value: "Qwen/Qwen2.5-1.5B-Instruct"}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: model-cache}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          args: ["--model", "Qwen/Qwen2.5-1.5B-Instruct", "--max-model-len", "4096", "--gpu-memory-utilization", "0.8"]
          env: [{name: HF_HOME, value: /models}]
          ports: [{containerPort: 8000}]
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {memory: 16Gi, nvidia.com/gpu: "1"}
          volumeMounts: [{name: model-cache, mountPath: /models}]
      volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: model-cache}
---
apiVersion: v1
kind: Service
metadata: {name: vllm}
spec:
  selector: {app: vllm}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis-exporter}}
  template:
    metadata: {labels: {app: redis-exporter}}
    spec:
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          args: ["--redis.addr=redis://redis:6379", "--check-keys=inference-jobs,inference-processing"]
          ports: [{containerPort: 9121}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis-exporter}
spec:
  selector: {app: redis-exporter}
  ports: [{port: 9121, targetPort: 9121}]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: inference-worker-autoscaler}
spec:
  scaleTargetRef: {name: inference-worker}
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: redis
      metadata: {address: "redis.llm-inference.svc.cluster.local:6379", listName: inference-jobs, listLength: "1"}
    - type: redis
      metadata: {address: "redis.llm-inference.svc.cluster.local:6379", listName: inference-processing, listLength: "1"}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: vllm-autoscaler}
spec:
  scaleTargetRef: {name: vllm}
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: redis
      metadata: {address: "redis.llm-inference.svc.cluster.local:6379", listName: inference-jobs, listLength: "1"}
    - type: redis
      metadata: {address: "redis.llm-inference.svc.cluster.local:6379", listName: inference-processing, listLength: "1"}
