grafana:
  sidecar:
    dashboards:
      enabled: true
prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    additionalScrapeConfigs:
      - job_name: redis-queue
        static_configs:
          - targets: ["redis-exporter.llm-inference.svc.cluster.local:9121"]
      - job_name: vllm
        metrics_path: /metrics
        static_configs:
          - targets: ["vllm.llm-inference.svc.cluster.local:8000"]
      - job_name: gateway
        static_configs:
          - targets: ["gateway.llm-inference.svc.cluster.local:8080"]
      - job_name: worker
        static_configs:
          - targets: ["worker-metrics.llm-inference.svc.cluster.local:9100"]
      - job_name: dcgm-self-managed
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [gpu-monitoring]
        relabel_configs:
          - action: keep
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: dcgm-exporter
          - action: keep
            source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9400"