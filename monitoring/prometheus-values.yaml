grafana:
  sidecar:
    dashboards:
      enabled: true
prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    additionalScrapeConfigs:
      - job_name: redis-queue
        static_configs:
          - targets: ["redis-exporter.llm-inference.svc.cluster.local:9121"]
      - job_name: vllm
        metrics_path: /metrics
        static_configs:
          - targets: ["vllm.llm-inference.svc.cluster.local:8000"]